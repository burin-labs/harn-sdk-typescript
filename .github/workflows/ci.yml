name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install signed publication runtime
        uses: burin-labs/harn/.github/actions/setup-harn@fb7275fa91979fd332edfcc7fdd5e70ce3026c2d
        with:
          version-file: scripts/signed-commit/.harn-version
      - name: Verify released signed publication adapter
        working-directory: scripts/signed-commit
        run: |
          harn install --locked
          harn check publish.harn publish_test.harn
          harn test publish_test.harn
      - run: pnpm check:protocol
      - run: pnpm typecheck
      - run: pnpm check:examples
      - run: pnpm check:tests
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:built-package
      - run: pnpm pack:dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-node-${{ matrix.node }}
          path: dist/
          if-no-files-found: error

  ci-status:
    name: CI status
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check commit signatures
        uses: burin-labs/.github/.github/actions/check-commit-signatures@80aff37b3b233bf6498eb4c0c6031d0b5365db86
        with:
          github-token: ${{ github.token }}
      - name: Require successful jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@80aff37b3b233bf6498eb4c0c6031d0b5365db86
        with:
          results-json: ${{ toJSON(needs.*.result) }}
